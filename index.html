<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f4f1f2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#17131a" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>트렌드 리포트 아카이브</title>
  <style>
    :root {
      --paper: #f4f1f2;
      --surface: #fffdfd;
      --surface-2: #eae5e8;
      --ink: #251c2c;
      --ink-soft: #64596a;
      --plum: #4b3157;
      --violet: #755d83;
      --rule: #cfc6cc;
      --signal: #d7ff52;
      --signal-ink: #1f2510;
      --open-violet: #7c5cbf;
      --meta: #574b61;
      --focus: #7c5cbf;
      --shadow: 0 18px 60px rgba(48, 30, 52, .10);
      --max: 1240px;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #17131a;
        --surface: #201a24;
        --surface-2: #2a222e;
        --ink: #f5f0f4;
        --ink-soft: #c0b4c3;
        --plum: #bca2ca;
        --violet: #9d84aa;
        --rule: #433849;
        --signal: #c9ef4e;
        --signal-ink: #182009;
        --meta: #cec2d4;
        --focus: #d8b7eb;
        --shadow: 0 24px 70px rgba(0, 0, 0, .30);
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Sans KR", sans-serif;
      font-size: 16px;
      line-height: 1.7;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    ::selection { background: color-mix(in srgb, var(--plum) 26%, transparent); }

    .shell {
      --grid-columns: 12;
      --grid-gap: 24px;
      width: min(100% - 40px, var(--max));
      margin: 0 auto;
      padding: 58px 0 72px;
      display: grid;
      grid-template-columns: repeat(var(--grid-columns), minmax(0, 1fr));
      column-gap: var(--grid-gap);
    }
    .masthead {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      column-gap: var(--grid-gap);
      align-items: end;
      border-top: 1px solid var(--ink);
      padding-top: 22px;
      margin-bottom: 52px;
    }
    .masthead > div:first-child { grid-column: 1 / span 9; }
    .masthead > .edition-mark { grid-column: 11 / -1; justify-self: end; }
    .kicker, .eyebrow, .issue-no, .meta-label, .source-index, .date-label {
      font-family: "IBM Plex Mono", monospace;
      letter-spacing: -.02em;
    }
    .kicker {
      margin: 0 0 20px;
      font-size: 13px;
      color: var(--plum);
    }
    .masthead h1 {
      margin: 0;
      max-width: 830px;
      font-size: clamp(42px, 6.4vw, 84px);
      line-height: .98;
      letter-spacing: -.065em;
      font-weight: 600;
    }
    .masthead h1 span { color: var(--violet); }
    .edition-mark {
      width: 154px;
      height: 154px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid var(--ink);
      text-align: center;
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      line-height: 1.45;
      transform: rotate(6deg);
    }
    .edition-mark b {
      display: block;
      font-size: 36px;
      line-height: 1;
      font-weight: 500;
    }

    .dashboard {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      column-gap: var(--grid-gap);
    }
    .content {
      grid-column: 4 / -1;
      min-width: 0;
    }
    .issue-head {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      column-gap: var(--grid-gap);
      align-items: end;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 34px;
    }
    .issue-head > div:first-child { grid-column: 1 / span 7; }
    .issue-head > .issue-meta { grid-column: 8 / -1; }
    .eyebrow { margin: 0 0 18px; color: var(--plum); font-size: 13px; }
    .issue-head h2 {
      margin: 0;
      font-size: clamp(35px, 5vw, 68px);
      line-height: 1.08;
      letter-spacing: -.055em;
      font-weight: 600;
    }
    .issue-meta { position: relative; text-align: right; }
    .issue-date-row { display: flex; justify-content: flex-end; align-items: center; gap: 11px; }
    .issue-meta time { display: block; font-size: 17px; font-weight: 600; }
    .issue-meta p { margin: 8px 0 0; color: var(--meta); font-size: 13px; }
    .calendar-trigger,
    .calendar-close,
    .mobile-calendar-trigger {
      appearance: none;
      border: 0;
      color: inherit;
      cursor: pointer;
    }
    .calendar-trigger {
      min-width: 42px;
      min-height: 42px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--rule);
      border-radius: 50%;
      background: var(--surface);
    }
    .calendar-trigger:hover,
    .calendar-trigger[aria-expanded="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
    .calendar-trigger svg,
    .mobile-calendar-trigger svg { width: 18px; height: 18px; }
    .calendar-scrim {
      position: fixed;
      inset: 0;
      z-index: 39;
      border: 0;
      padding: 0;
      background: rgba(23, 19, 26, .34);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    .calendar-scrim.is-open { opacity: 1; pointer-events: auto; }
    .calendar-layer {
      position: absolute;
      z-index: 40;
      width: 334px;
      top: calc(100% + 16px);
      right: 0;
      padding: 22px;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 2px 18px 18px 18px;
      box-shadow: var(--shadow);
      text-align: left;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-8px);
      transition: opacity .2s ease, transform .2s ease, visibility .2s;
    }
    .calendar-layer.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
    }
    .calendar-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
    .calendar-nav { display: flex; gap: 8px; margin-bottom: 16px; }
    .calendar-nav-btn {
      appearance: none;
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--meta);
      border-radius: 999px;
      padding: 5px 12px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      cursor: pointer;
      min-height: 32px;
    }
    .calendar-nav-btn:hover { border-color: var(--ink); color: var(--ink); }
    .calendar-nav-btn.is-active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .calendar-nav-btn:disabled { opacity: .35; cursor: default; }
    .calendar-nav-btn:disabled:hover { border-color: var(--rule); color: var(--meta); }
    .calendar-month { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.035em; }
    .calendar-caption { margin: 2px 0 0; color: var(--meta); font-family: "IBM Plex Mono", monospace; font-size: 10px; }
    .calendar-close {
      display: none;
      width: 38px;
      height: 38px;
      place-items: center;
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 50%;
      line-height: 1;
    }
    .calendar-close svg { width: 18px; height: 18px; }
    .calendar-weekdays,
    .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); }
    .calendar-weekdays { margin-bottom: 5px; }
    .calendar-weekdays span {
      text-align: center;
      color: var(--meta);
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
    }
    .calendar-day,
    .calendar-blank {
      aspect-ratio: 1;
      min-width: 0;
      display: grid;
      place-items: center;
    }
    .calendar-day {
      position: relative;
      appearance: none;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--ink-soft);
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
    }
    button.calendar-day { color: var(--ink); cursor: pointer; font-weight: 500; }
    button.calendar-day::after {
      content: "";
      position: absolute;
      bottom: 4px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--violet);
    }
    button.calendar-day:hover { background: var(--surface-2); }
    button.calendar-day[aria-current="date"] {
      background: var(--ink);
      color: var(--paper);
    }
    button.calendar-day[aria-current="date"]::after { background: var(--open-violet); }
    .calendar-legend {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 16px 0 0;
      padding-top: 13px;
      border-top: 1px solid var(--rule);
      color: var(--meta);
      font-size: 11px;
    }
    .calendar-legend::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--violet);
    }
    .mobile-calendar-trigger { display: none; }
    .calendar-layer[hidden],
    .calendar-scrim[hidden],
    .calendar-close[hidden] { display: none !important; }

    .summary {
      padding: 36px 0 40px;
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      column-gap: var(--grid-gap);
      border-bottom: 1px solid var(--rule);
    }
    .summary > h3 { grid-column: 1 / span 2; }
    .summary > .summary-list { grid-column: 3 / -1; }
    .summary h3 {
      margin: 2px 0 0;
      font-size: 13px;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      color: var(--plum);
    }
    .summary-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 15px; }
    .summary-list li {
      position: relative;
      padding-left: 26px;
      font-size: clamp(17px, 1.8vw, 21px);
      line-height: 1.55;
      letter-spacing: -.02em;
    }
    .summary-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: .72em;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--open-violet);
      box-shadow: 0 0 0 1px rgba(0,0,0,.18);
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      column-gap: var(--grid-gap);
      align-items: center;
      padding: 24px 0;
      border-bottom: 1px solid var(--rule);
    }
    .tools > .search-wrap { grid-column: 1 / span 7; }
    .tools > .result-count { grid-column: 8 / -1; justify-self: end; }
    .search-wrap { position: relative; }
    .search-wrap svg {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--ink-soft);
      pointer-events: none;
    }
    .search {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--ink);
      padding: 10px 12px 10px 30px;
      border-bottom: 1px solid transparent;
      border-radius: 0;
    }
    .search::placeholder { color: var(--meta); opacity: 1; }
    .search:focus { outline: none; border-bottom-color: var(--ink); }
    .result-count { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--meta); white-space: nowrap; }

    .trend-list { border-bottom: 1px solid var(--ink); }
    .trend {
      border-bottom: 1px solid var(--rule);
    }
    .trend:last-child { border-bottom: 0; }
    .trend[hidden] { display: none; }
    .trend summary {
      list-style: none;
      cursor: pointer;
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      column-gap: var(--grid-gap);
      align-items: start;
      padding: 30px 0;
    }
    .trend summary > .trend-number { grid-column: 1; }
    .trend summary > .trend-title { grid-column: 2 / span 7; }
    .trend summary > .toggle { grid-column: 9; justify-self: end; }
    .trend summary::-webkit-details-marker { display: none; }
    .trend-number { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--violet); padding-top: 5px; }
    .trend-title { font-size: clamp(22px, 2.8vw, 34px); font-weight: 600; line-height: 1.25; letter-spacing: -.04em; }
    .toggle {
      width: 34px;
      height: 34px;
      border: 1px solid var(--rule);
      border-radius: 50%;
      position: relative;
      margin-top: 1px;
    }
    .toggle::before, .toggle::after {
      content: "";
      position: absolute;
      background: currentColor;
      left: 9px;
      right: 9px;
      height: 1px;
      top: 16px;
      transition: transform .2s ease;
    }
    .toggle::after { transform: rotate(90deg); }
    .trend[open] .toggle::after { transform: rotate(0deg); }
    .trend-body {
      padding: 0 0 38px;
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      column-gap: var(--grid-gap);
    }
    .trend-body > .explanation { grid-column: 2 / span 5; }
    .trend-body > .analysis { grid-column: 7 / -1; }
    .explanation p { margin: 0 0 14px; color: var(--ink-soft); }
    .analysis {
      align-self: start;
      background: var(--surface-2);
      padding: 22px;
      border: 1px solid color-mix(in srgb, var(--plum) 38%, transparent);
      border-radius: 6px;
    }
    .analysis .meta-label { display: block; margin-bottom: 11px; font-size: 11px; color: var(--plum); }
    .analysis p { margin: 0; font-size: 14px; line-height: 1.7; }
    .related { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px; }
    .related a {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 7px 11px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      text-decoration: none;
      color: var(--plum);
      background: var(--surface);
    }
    .related a:hover { border-color: var(--plum); background: var(--surface-2); }
    .trend summary:hover .trend-title { color: var(--plum); }
    .trend summary:hover .toggle { border-color: var(--ink); }
    .trend summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

    .empty {
      display: none;
      padding: 56px 0;
      color: var(--ink-soft);
      text-align: center;
    }
    .empty.show { display: block; }

    .sources { padding-top: 44px; }
    .sources-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 20px;
      margin-bottom: 18px;
    }
    .sources h3 { margin: 0; font-size: 20px; letter-spacing: -.03em; }
    .sources-head span { color: var(--meta); font-family: "IBM Plex Mono", monospace; font-size: 11px; }
    .source-list { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--rule); }
    .source-list li { border-bottom: 1px solid var(--rule); }
    .source-list a {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 14px 0;
      text-decoration: none;
    }
    .source-index { font-size: 11px; color: var(--violet); }
    .source-domain { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
    .source-arrow { display: inline-grid; place-items: center; color: var(--meta); transition: transform .2s ease; }
    .source-arrow svg { width: 16px; height: 16px; }
    .source-list a:hover .source-domain { color: var(--plum); }
    .source-list a:hover .source-arrow { transform: translate(3px, -3px); color: var(--plum); }

    .issue-index { padding-top: 44px; }
    .issue-index-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 20px;
      margin-bottom: 18px;
    }
    .issue-index h3 { margin: 0; font-size: 20px; letter-spacing: -.03em; }
    .issue-index-head span { color: var(--meta); font-family: "IBM Plex Mono", monospace; font-size: 11px; }
    .issue-index-list { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--rule); }
    .issue-index-list li { border-bottom: 1px solid var(--rule); }
    .issue-index-row {
      appearance: none;
      width: 100%;
      min-height: 52px;
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      column-gap: var(--grid-gap);
      align-items: center;
      padding: 12px 0;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      text-align: left;
    }
    .issue-index-row > .index-no { grid-column: 1; }
    .issue-index-row > .index-date { grid-column: 2 / span 2; }
    .issue-index-row > .index-title { grid-column: 4 / span 5; }
    .issue-index-row > .index-now { grid-column: 9; justify-self: end; }
    .index-no { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--violet); }
    .index-date { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--meta); white-space: nowrap; }
    .index-title { font-size: 15px; font-weight: 500; letter-spacing: -.02em; line-height: 1.45; }
    .index-now {
      display: none;
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      color: var(--open-violet);
      white-space: nowrap;
    }
    .issue-index-row:hover { background: var(--surface-2); }
    .issue-index-row:hover .index-title { color: var(--plum); }
    .issue-index-row.is-current { background: var(--surface-2); }
    .issue-index-row.is-current .index-no { color: var(--open-violet); font-weight: 500; }
    .issue-index-row.is-current .index-title { font-weight: 600; }
    .issue-index-row.is-current .index-now { display: block; }

    .footer {
      grid-column: 1 / -1;
      margin-top: 80px;
      padding-top: 22px;
      border-top: 1px solid var(--ink);
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      column-gap: var(--grid-gap);
      color: var(--meta);
      font-size: 12px;
    }
    .footer > strong { grid-column: 1 / span 6; }
    .footer > span { grid-column: 7 / -1; justify-self: end; }
    .footer strong { color: var(--ink); font-weight: 500; }

    @media (max-width: 860px) {
      .shell {
        --grid-columns: 6;
        --grid-gap: 16px;
        width: min(100% - 32px, var(--max));
        padding-top: 34px;
      }
      .masthead { grid-template-columns: repeat(6, minmax(0, 1fr)); margin-bottom: 34px; }
      .masthead > div:first-child { grid-column: 1 / -1; }
      .edition-mark { display: none; }
      .dashboard { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .content { grid-column: 1 / -1; }
      .issue-head { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .issue-head > div:first-child { grid-column: 1 / span 4; }
      .issue-head > .issue-meta { grid-column: 5 / -1; }
      .issue-date-row { justify-content: flex-end; }
      .calendar-trigger { display: none; }
      .mobile-calendar-trigger {
        position: fixed;
        z-index: 35;
        top: 43%;
        right: 0;
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        padding: 0;
        background: var(--ink);
        color: var(--paper);
        border-radius: 14px 0 0 14px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, .18);
      }
      .calendar-layer {
        position: fixed;
        z-index: 40;
        top: 0;
        right: 0;
        width: min(88vw, 370px);
        height: 100dvh;
        padding: max(26px, env(safe-area-inset-top)) 24px max(26px, env(safe-area-inset-bottom));
        border-width: 0 0 0 1px;
        border-radius: 18px 0 0 18px;
        overflow-y: auto;
        opacity: 1;
        visibility: visible;
        transform: translateX(102%);
        transition: transform .24s ease, visibility .24s;
      }
      .calendar-layer.is-open { transform: translateX(0); }
      .calendar-close { display: grid; }
      .calendar-day, .calendar-blank { min-height: 42px; }
      .calendar-legend { margin-top: 24px; }
      .summary,
      .tools,
      .trend summary,
      .trend-body { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .summary > h3 { grid-column: 1; }
      .summary > .summary-list { grid-column: 2 / -1; }
      .tools > .search-wrap { grid-column: 1 / span 4; }
      .tools > .result-count { grid-column: 5 / -1; }
      .trend summary > .trend-number { grid-column: 1; }
      .trend summary > .trend-title { grid-column: 2 / span 4; }
      .trend summary > .toggle { grid-column: 6; }
      .trend-body > .explanation { grid-column: 2 / span 3; }
      .trend-body > .analysis { grid-column: 5 / -1; }
      .issue-index-row { grid-template-columns: repeat(6, minmax(0, 1fr)); min-height: 52px; }
      .issue-index-row > .index-no { grid-column: 1; }
      .issue-index-row > .index-date { grid-column: 2 / span 2; }
      .issue-index-row > .index-title { grid-column: 4 / span 2; }
      .issue-index-row > .index-now { grid-column: 6; }
      .footer { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .footer > strong { grid-column: 1 / span 3; }
      .footer > span { grid-column: 4 / -1; }
    }

    @media (max-width: 560px) {
      body { font-size: 15px; }
      .shell { width: min(100% - 24px, var(--max)); padding: 24px 0 48px; }
      .masthead { padding-top: 15px; margin-bottom: 26px; }
      .kicker { margin-bottom: 14px; font-size: 11px; }
      .masthead h1 { font-size: clamp(38px, 12vw, 58px); }
      .issue-head { row-gap: 18px; padding-bottom: 24px; }
      .issue-head > div:first-child,
      .issue-head > .issue-meta { grid-column: 1 / -1; }
      .issue-head h2 { font-size: 36px; }
      .issue-meta { text-align: left; display: flex; gap: 16px; align-items: baseline; }
      .issue-date-row { justify-content: flex-start; }
      .summary { row-gap: 18px; padding: 26px 0 30px; }
      .summary > h3,
      .summary > .summary-list { grid-column: 1 / -1; }
      .summary-list li { padding-left: 22px; font-size: 16px; }
      .tools { row-gap: 6px; padding: 18px 0; }
      .tools > .search-wrap,
      .tools > .result-count { grid-column: 1 / -1; justify-self: stretch; }
      .result-count { padding-left: 30px; }
      .trend summary { column-gap: 10px; padding: 24px 0; }
      .trend-number { font-size: 11px; }
      .trend-title { font-size: 21px; }
      .toggle { width: 30px; height: 30px; }
      .toggle::before, .toggle::after { left: 8px; right: 8px; top: 14px; }
      .trend-body { row-gap: 22px; padding-bottom: 30px; }
      .trend-body > .explanation,
      .trend-body > .analysis { grid-column: 1 / -1; }
      .analysis { padding: 18px; border-radius: 6px; }
      .source-list a { grid-template-columns: 30px minmax(0, 1fr) auto; }
      .issue-index-row { padding: 12px 0; }
      .index-title { font-size: 14px; }
      .index-date { font-size: 11px; }
      .footer { margin-top: 56px; row-gap: 6px; }
      .footer > strong,
      .footer > span { grid-column: 1 / -1; justify-self: start; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="kicker">WEB DESIGN RESEARCH · DAILY ARCHIVE</p>
        <h1>지금 열린 흐름,<br><span>다음 화면의 근거.</span></h1>
      </div>
      <div class="edition-mark" aria-hidden="true"><span>ISSUES<b>19</b></span></div>
    </header>

    <div class="dashboard">
      <section class="content">
        <article id="issuePanel" role="tabpanel" aria-live="polite">
          <header class="issue-head">
            <div>
              <p class="eyebrow" id="issueEyebrow"></p>
              <h2 id="issueTitle"></h2>
            </div>
            <div class="issue-meta">
              <div class="issue-date-row">
                <time id="issueDate"></time>
                <button class="calendar-trigger" id="calendarTrigger" type="button" aria-expanded="false" aria-controls="calendarLayer" aria-label="리포트 달력 열기">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="15" rx="2"></rect><path d="M7.5 3.5v4M16.5 3.5v4M3.5 10h17"></path></svg>
                </button>
              </div>
              <p id="issueNote"></p>
              <aside class="calendar-layer" id="calendarLayer" aria-label="리포트 달력" aria-hidden="true" hidden>
                <div class="calendar-top">
                  <div><h3 class="calendar-month" id="calendarMonthTitle">2026년 11월</h3><p class="calendar-caption">DAILY REPORT ARCHIVE</p></div>
                  <button class="calendar-close" id="calendarClose" type="button" aria-label="달력 닫기" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                </div>
                <div class="calendar-nav" role="group" aria-label="달력 월 이동">
                  <button type="button" class="calendar-nav-btn" id="calendarPrev" aria-label="이전 달">← 10월</button>
                  <button type="button" class="calendar-nav-btn" id="calendarNext" aria-label="다음 달">11월 →</button>
                </div>
                <div class="calendar-weekdays" aria-hidden="true"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div>
                <div class="calendar-days" id="calendarDays"></div>
                <p class="calendar-legend">점이 표시된 날짜에 리포트가 있습니다.</p>
              </aside>
            </div>
          </header>

          <section class="summary" aria-labelledby="summaryTitle">
            <h3 id="summaryTitle">오늘의 서머리</h3>
            <ul class="summary-list" id="summaryList"></ul>
          </section>

          <div class="tools">
            <label class="search-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
              <span class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">현재 리포트 검색</span>
              <input class="search" id="trendSearch" type="search" placeholder="제목·내용·분석 검색" autocomplete="off" />
            </label>
            <span class="result-count" id="resultCount"></span>
          </div>

          <section class="trend-list" id="trendList" aria-label="트렌드 분석"></section>
          <div class="empty" id="emptyState">검색 결과가 없습니다.</div>

          <section class="sources" aria-labelledby="sourcesTitle">
            <div class="sources-head">
              <h3 id="sourcesTitle">참고</h3>
              <span id="sourceCount"></span>
            </div>
            <ol class="source-list" id="sourceList"></ol>
          </section>

          <section class="issue-index" aria-labelledby="issueIndexTitle">
            <div class="issue-index-head">
              <h3 id="issueIndexTitle">전체 회차</h3>
              <span id="issueIndexCount"></span>
            </div>
            <ol class="issue-index-list" id="issueIndexList"></ol>
          </section>
        </article>
      </section>
    </div>

    <button class="mobile-calendar-trigger" id="mobileCalendarTrigger" type="button" aria-expanded="false" aria-controls="calendarLayer" aria-label="리포트 달력 열기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="15" rx="2"></rect><path d="M7.5 3.5v4M16.5 3.5v4M3.5 10h17"></path></svg>
    </button>
    <button class="calendar-scrim" id="calendarScrim" type="button" aria-label="달력 닫기" hidden></button>

    <footer class="footer">
      <strong>열리는 생각, 열리는 화면.</strong>
      <span>2026.10.02 ~ 11.14 · 19회차 기록</span>
    </footer>
  </main>

  <script src="issues-a.js"></script>
  <script src="issues-b.js"></script>
  <script src="issues-c.js"></script>
  <script>
    const issues = [...issuesA, ...issuesB, ...issuesC];

    const calendarTrigger = document.getElementById("calendarTrigger");
    const mobileCalendarTrigger = document.getElementById("mobileCalendarTrigger");
    const calendarLayer = document.getElementById("calendarLayer");
    const calendarClose = document.getElementById("calendarClose");
    const calendarScrim = document.getElementById("calendarScrim");
    const calendarDays = document.getElementById("calendarDays");
    const calendarMonthTitle = document.getElementById("calendarMonthTitle");
    const calendarPrev = document.getElementById("calendarPrev");
    const calendarNext = document.getElementById("calendarNext");
    let calendarYear = 2026;
    let calendarMonth = 11;
    const issueEyebrow = document.getElementById("issueEyebrow");
    const issueTitle = document.getElementById("issueTitle");
    const issueDate = document.getElementById("issueDate");
    const issueNote = document.getElementById("issueNote");
    const summaryList = document.getElementById("summaryList");
    const trendList = document.getElementById("trendList");
    const sourceList = document.getElementById("sourceList");
    const sourceCount = document.getElementById("sourceCount");
    const trendSearch = document.getElementById("trendSearch");
    const resultCount = document.getElementById("resultCount");
    const emptyState = document.getElementById("emptyState");
    const issueIndexList = document.getElementById("issueIndexList");
    const issueIndexCount = document.getElementById("issueIndexCount");
    let activeId = issues[0].id;

    function domainOf(url) {
      try { return new URL(url).hostname.replace(/^www\./, ""); }
      catch (e) { return url; }
    }

    function shortLinkLabel(url, index) {
      const domain = domainOf(url);
      return `${String(index + 1).padStart(2, "0")} · ${domain}`;
    }

    function buildCalendar() {
      calendarDays.innerHTML = "";
      calendarMonthTitle.textContent = `${calendarYear}년 ${calendarMonth}월`;
      calendarPrev.textContent = "← 10월";
      calendarNext.textContent = "11월 →";
      calendarPrev.classList.toggle("is-active", calendarMonth === 10);
      calendarNext.classList.toggle("is-active", calendarMonth === 11);
      calendarPrev.disabled = calendarMonth === 10;
      calendarNext.disabled = calendarMonth === 11;
      const firstDow = (new Date(calendarYear, calendarMonth - 1, 1).getDay() + 6) % 7;
      const daysInMonth = new Date(calendarYear, calendarMonth, 0).getDate();
      for (let blank = 0; blank < firstDow; blank += 1) {
        const spacer = document.createElement("span");
        spacer.className = "calendar-blank";
        spacer.setAttribute("aria-hidden", "true");
        calendarDays.appendChild(spacer);
      }
      for (let day = 1; day <= daysInMonth; day += 1) {
        const id = `${calendarYear}-${String(calendarMonth).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const issue = issues.find(function (item) { return item.id === id; });
        const cell = document.createElement(issue ? "button" : "span");
        cell.className = "calendar-day";
        cell.textContent = String(day);
        if (issue) {
          cell.type = "button";
          cell.dataset.issue = id;
          cell.setAttribute("aria-label", `${issue.date} ${issue.day}요일 리포트 보기`);
          if (id === activeId) cell.setAttribute("aria-current", "date");
          cell.addEventListener("click", function () {
            renderIssue(id);
            closeCalendar();
            document.getElementById("issuePanel").scrollIntoView({ behavior: "smooth", block: "start" });
          });
        } else {
          cell.setAttribute("aria-hidden", "true");
        }
        calendarDays.appendChild(cell);
      }
    }

    function buildIssueIndex() {
      issueIndexCount.textContent = `${issues.length} ISSUES`;
      issueIndexList.innerHTML = "";
      issues.slice().reverse().forEach(function (issue) {
        const item = document.createElement("li");
        const row = document.createElement("button");
        row.type = "button";
        row.className = "issue-index-row";
        row.dataset.issue = issue.id;
        row.setAttribute("aria-label", `${issue.issue}회차 ${issue.date} ${issue.day}요일 리포트 보기`);
        row.innerHTML = `<span class="index-no">ISSUE ${issue.issue}</span><span class="index-date">${issue.date}</span><span class="index-title">${issue.title}</span><span class="index-now" aria-hidden="true">현재 회차</span>`;
        row.addEventListener("click", function () {
          renderIssue(issue.id);
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
        item.appendChild(row);
        issueIndexList.appendChild(item);
      });
    }

    function updateIssueIndex() {
      issueIndexList.querySelectorAll(".issue-index-row").forEach(function (row) {
        const current = row.dataset.issue === activeId;
        row.classList.toggle("is-current", current);
        if (current) row.setAttribute("aria-current", "true");
        else row.removeAttribute("aria-current");
      });
    }

    function setCalendar(open) {
      const mobile = window.matchMedia("(max-width: 860px)").matches;
      calendarLayer.hidden = !open;
      calendarScrim.hidden = !(open && mobile);
      calendarClose.hidden = !(open && mobile);
      calendarLayer.classList.toggle("is-open", open);
      calendarScrim.classList.toggle("is-open", open && mobile);
      calendarLayer.setAttribute("aria-hidden", String(!open));
      calendarTrigger.setAttribute("aria-expanded", String(open));
      mobileCalendarTrigger.setAttribute("aria-expanded", String(open));
      if (open && mobile) calendarClose.focus();
    }

    function openCalendar() { setCalendar(true); }
    function closeCalendar() { setCalendar(false); }
    function toggleCalendar() { setCalendar(!calendarLayer.classList.contains("is-open")); }

    function renderIssue(id) {
      activeId = id;
      const issue = issues.find(function (item) { return item.id === id; });
      if (!issue) return;
      const parts = id.split("-");
      calendarYear = Number(parts[0]);
      calendarMonth = Number(parts[1]);
      buildCalendar();
      trendSearch.value = "";
      issueEyebrow.textContent = `ISSUE ${issue.issue} · DAILY REPORT`;
      issueTitle.textContent = issue.title;
      issueDate.textContent = issue.date;
      issueDate.dateTime = issue.id;
      issueNote.textContent = issue.note;

      summaryList.innerHTML = issue.summary.map(function (item) { return `<li>${item}</li>`; }).join("");
      trendList.innerHTML = issue.trends.map(function (trend, index) {
        const links = trend.links.map(function (link, linkIndex) {
          return `<a href="${link}" target="_blank" rel="noopener noreferrer" title="${link}">${shortLinkLabel(link, linkIndex)}</a>`;
        }).join("");
        const paragraphs = trend.body.map(function (paragraph) { return `<p>${paragraph}</p>`; }).join("");
        const searchable = [trend.title].concat(trend.body).concat(trend.analysis).join(" ").toLowerCase();
        return `<details class="trend" data-search="${searchable}" ${index === 0 ? "open" : ""}>
          <summary>
            <span class="trend-number">${String(index + 1).padStart(2, "0")}</span>
            <span class="trend-title">${trend.title}</span>
            <span class="toggle" aria-hidden="true"></span>
          </summary>
          <div class="trend-body">
            <div class="explanation">${paragraphs}<div class="related">${links}</div></div>
            <aside class="analysis"><span class="meta-label">APERTE NOTE</span><p>${trend.analysis}</p></aside>
          </div>
        </details>`;
      }).join("");

      sourceList.innerHTML = issue.sources.map(function (source, index) {
        return `<li><a href="${source}" target="_blank" rel="noopener noreferrer" title="${source}"><span class="source-index">${String(index + 1).padStart(2, "0")}</span><span class="source-domain">${domainOf(source)}</span><span class="source-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"></path><path d="M8.5 7H17v8.5"></path></svg></span></a></li>`;
      }).join("");
      sourceCount.textContent = `${issue.sources.length} SOURCES`;
      updateIssueIndex();
      updateFilter();
      document.getElementById("issuePanel").focus({ preventScroll: true });
    }

    function updateFilter() {
      const query = trendSearch.value.trim().toLowerCase();
      const trends = Array.from(trendList.querySelectorAll(".trend"));
      let visible = 0;
      trends.forEach(function (trend) {
        const match = !query || trend.dataset.search.includes(query);
        trend.hidden = !match;
        if (match) visible += 1;
      });
      resultCount.textContent = `${visible} / ${trends.length} SIGNALS`;
      emptyState.classList.toggle("show", visible === 0);
    }

    trendSearch.addEventListener("input", updateFilter);
    calendarPrev.addEventListener("click", function () { calendarYear = 2026; calendarMonth = 10; buildCalendar(); });
    calendarNext.addEventListener("click", function () { calendarYear = 2026; calendarMonth = 11; buildCalendar(); });
    calendarTrigger.addEventListener("click", toggleCalendar);
    mobileCalendarTrigger.addEventListener("click", openCalendar);
    calendarClose.addEventListener("click", closeCalendar);
    calendarScrim.addEventListener("click", closeCalendar);
    document.addEventListener("click", function (event) {
      if (window.matchMedia("(max-width: 860px)").matches) return;
      if (!calendarLayer.contains(event.target) && !calendarTrigger.contains(event.target)) closeCalendar();
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && calendarLayer.classList.contains("is-open")) {
        closeCalendar();
        (window.matchMedia("(max-width: 860px)").matches ? mobileCalendarTrigger : calendarTrigger).focus();
      }
    });
    window.addEventListener("resize", closeCalendar);
    buildIssueIndex();
    renderIssue(activeId);
  </script>
</body>
</html>
